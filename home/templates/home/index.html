{% extends 'base.html' %}

{% block content %}
    {% for product in products %}

        <div class="card" style="width: 20%;">
            <img src="{{ product.image.url }}" alt="{{ product.slug }} image" class="card-img-top">
            <div class="card-body">
                <a href="{{ product.get_absolute_url }}" class="card-title">{{ product.name }}</a>
            </div>
        </div>

    {% endfor %}
{% endblock content %}
