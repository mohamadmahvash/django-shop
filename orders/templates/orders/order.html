{% extends 'base.html' %}

{% load humanize %}

{% block content %}

    <h3>Checkout</h3>
    <p>Total: {{ order.get_total_price|intcomma }}</p>

    <form action="{% url 'orders:coupon_apply' order.id %}" method="post" style="display: ruby">
        {% csrf_token %}
        {{ form }}
        <input type="submit" value="Apply" class="btn btn-success">
    </form>

    <br>
    <br>
    <a href="{% url 'orders:order_payment' order.id %}" class="btn btn-info">Payment</a>

{% endblock content %}
